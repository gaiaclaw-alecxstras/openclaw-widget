name: Build iOS Widget

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Show Xcode version
      run: xcodebuild -version
    
    - name: Package Project
      run: |
        cd openclaw-widget
        
        # Create a build directory
        mkdir -p build
        
        # Create Xcode project structure
        mkdir -p OpenClawWidgetApp/OpenClawWidget
        mkdir -p OpenClawWidgetApp/OpenClawWidgetExtension
        
        # Copy widget source files
        cp OpenClawWidget/*.swift OpenClawWidgetApp/OpenClawWidgetExtension/
        
        # Create host app main.swift
        cat > OpenClawWidgetApp/OpenClawWidget/main.swift << 'EOF'
        import UIKit

        @main
        class AppDelegate: UIResponder, UIApplicationDelegate {
            var window: UIWindow?
            
            func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                window = UIWindow(frame: UIScreen.main.bounds)
                let vc = UIViewController()
                vc.view.backgroundColor = .systemBackground
                
                let label = UILabel()
                label.text = "OpenClaw Widget\n\nAdd the widget to your home screen"
                label.numberOfLines = 0
                label.textAlignment = .center
                label.font = .preferredFont(forTextStyle: .title2)
                label.translatesAutoresizingMaskIntoConstraints = false
                
                vc.view.addSubview(label)
                NSLayoutConstraint.activate([
                    label.centerXAnchor.constraint(equalTo: vc.view.centerXAnchor),
                    label.centerYAnchor.constraint(equalTo: vc.view.centerYAnchor)
                ])
                
                window?.rootViewController = vc
                window?.makeKeyAndVisible()
                return true
            }
        }
        EOF
        
        # Create Info.plist for host app
        cat > OpenClawWidgetApp/OpenClawWidget/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>com.openclaw.widget.app</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>OpenClaw</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIApplicationSceneManifest</key>
            <dict>
                <key>UIApplicationSupportsMultipleScenes</key>
                <false/>
            </dict>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
                <string>armv7</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
                <string>UIInterfaceOrientationPortrait</string>
            </array>
        </dict>
        </plist>
        EOF
        
        # Create Info.plist for widget extension
        cat > OpenClawWidgetApp/OpenClawWidgetExtension/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>OpenClaw Widget</string>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>com.openclaw.widget.app.widget</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>OpenClawWidget</string>
            <key>CFBundlePackageType</key>
            <string>XPC!</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>NSExtension</key>
            <dict>
                <key>NSExtensionPointIdentifier</key>
                <string>com.apple.widgetkit-extension</string>
            </dict>
        </dict>
        </plist>
        EOF
        
        # Create entitlements
        cat > OpenClawWidgetApp/OpenClawWidget/OpenClawWidget.entitlements << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>com.apple.security.application-groups</key>
            <array>
                <string>group.com.openclaw.widget</string>
            </array>
        </dict>
        </plist>
        EOF
        
        cp OpenClawWidgetApp/OpenClawWidget/OpenClawWidget.entitlements OpenClawWidgetApp/OpenClawWidgetExtension/OpenClawWidgetExtension.entitlements
        
        # Create project.yml without the problematic target type
        # Just package the source files for manual Xcode project creation
        
        # Create a simple README for Xcode setup
        cat > OpenClawWidgetApp/XCODE_SETUP.md << 'EOF'
        # Xcode Setup Instructions
        
        Since this project uses WidgetKit, you need to create the Xcode project manually:
        
        1. Open Xcode
        2. Create new iOS App project
        3. File → New → Target → Widget Extension
        4. Name: OpenClawWidgetExtension
        5. Copy the Swift files from OpenClawWidgetExtension/ to your widget target
        6. Add App Group capability: group.com.openclaw.widget
        7. Build and run
        
        The Swift source files are ready to use!
        EOF
        
        # Package everything
        zip -r build/OpenClawWidget-Project.zip OpenClawWidgetApp/ OpenClawWidget/ Scripts/ setup.sh verify.sh Makefile README.md
        
        echo "Packaged project files."
        ls -la build/
        
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OpenClawWidget-Build
        path: |
          openclaw-widget/build/*.zip
        if-no-files-found: warn
        
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: OpenClaw Widget v${{ github.run_number }}
        files: |
          openclaw-widget/build/*.zip
        draft: true
        body: |
          OpenClaw Widget Project Files
          
          ## Contents
          - Swift source files for the widget
          - Session monitor scripts
          - Setup and verification tools
          - Xcode setup instructions
          
          ## Installation
          1. Download `OpenClawWidget-Project.zip`
          2. Extract and follow `XCODE_SETUP.md` instructions
          3. Run `./setup.sh` to install the session monitor
          4. Build in Xcode and add widget to home screen
          
          ## Requirements
          - Xcode 14+
          - iOS 15+
          - macOS (for session monitor)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
